<style>
html{
  --foreground-color:light-dark(#333,#ccc);
  --background-color:light-dark(#eee,#222);
  --link-color:#3ce;--accent-color:#d42;
  --font-weight-adjustment:0;
  color-scheme:dark light only;
  accent-color:var(--accent-color);
  width:100%;height:100%;
  font:calc(400 + var(--font-weight-adjustment)) clamp(10pt, 6pt + .8vmin + .35vmax, 24pt)/1.35 sans-serif;
  background:var(--background-color);
  color:var(--foreground-color);
  scroll-behavior:smooth;
}
:where(*){margin:0;padding:0;box-sizing:border-box}
.custom-font{position:relative}
:where(.custom-font)::after{
  content:'';
  pointer-events:none;
  position:absolute;
  inset:0;
  background:var(--background-color);
  opacity:1;
}
@media not (prefers-reduced-motion:reduce){
  .custom-font:after{transition:opacity 600ms ease-in}
}
body{
  min-height:100%;
  display:grid;grid-template-rows:1fr;gap:1em;place-content:center;
}
a{color:inherit}
a:hover{color:var(--link-color)}
header{
  position:absolute;
  top:0;left:0;right:0;
  padding:4px;
  display:grid;
  justify-content:end;
  align-items:center;
  grid-template-columns:repeat(2,min-content);
  gap:1em;
  a.language{
    display:grid;
    place-self:stretch;
    place-items:center;
    font-size:1.25em;
    min-width:2.5em;
    &:not(:hover){text-decoration:none}
  }
  div{
    position:relative;
    display:grid;
    place-items:center;
    &:hover{color:var(--link-color)}
    input.color-scheme{
      position:absolute;
      inset:0;
      appearance:none;margin:0;padding:0;
      cursor:pointer;
      width:2em;
      height:2em;
      &~svg{
        display:none;
        padding:.5em;
        width:2em;height:2em;
        path{fill:currentColor}
      }
    }
  }
}
main{
  display:grid;
  place-items:center;
  grid-auto-rows:auto;
  gap:2em;
  section{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:100dvh;
    padding:2rem;
    max-width:60ch;
    font:calc(300 + var(--font-weight-adjustment,0)) 1em __roboto-slab__;font-stretch:100%;
    letter-spacing:-.01em;
    line-height:calc(1.25em + 1vh);
    text-wrap:balance;
    p{
      display:grid;
      align-items:center;
      padding:.5em 0;
      flex:1 1 auto;
    }
    a:first-child,a:last-child{
      flex:3 3 auto;
      display:grid;
      place-items:center;
      padding:1em;
      svg{width:2em;height:2em}
    }
  }
}
@media(prefers-color-scheme:light){
  :root{
    color-scheme:light only;
    --font-weight-adjustment:100;
    &:has(header input:checked){
      color-scheme:dark only;
      --font-weight-adjustment:0;
    }
    header input.color-scheme{
      &~svg.light{display:block}
      &~svg.dark{display:none}
      &:checked{
        &~svg.light{display:none}
        &~svg.dark{display:block}
      }
    }
  }
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark only;
    --font-weight-adjustment:0;
    &:has(header input:checked){
      color-scheme:light only;
      --font-weight-adjustment:100;
    }
    header input.color-scheme{
      &~svg.light{display:none}
      &~svg.dark{display:block}
      &:checked{
        &~svg.light{display:block}
        &~svg.dark{display:none}
      }
    }
  }
}
</style>
</head>
<body class="custom-font">

    <symbol id="prev" viewBox="0 0 16 16">
      <use href="#next" transform="rotate(180 8 8)"/>
    </symbol>
  </defs>
</svg>
<script type="module">
const colorSchemeOverride=localStorage.getItem('color-scheme');
if(colorSchemeOverride&&!window.matchMedia(`(prefers-color-scheme: ${colorSchemeOverride})`).matches){
  document.querySelectorAll('.color-scheme').forEach(el=>el.checked=true);
}
document.querySelectorAll('.color-scheme').forEach(el=>{
  el.addEventListener('change',_=>{
    if(el.checked){
      localStorage.setItem('color-scheme',window.matchMedia('(prefers-color-scheme: light)').matches?'dark':'light');
    }else{
      localStorage.removeItem('color-scheme');
    }
  });
});
const langs=['en','fr'];
const langOverride=localStorage.getItem('lang');
const defaultLang=navigator.languages.map(it=>it.replace(/^([^-]+).*$/,'$1')).find(it=>langs.includes(it))??'en';
if(langOverride&&langOverride!==defaultLang) localStorage.removeItem('lang');
document.querySelectorAll('.language').forEach(el=>{
  el.addEventListener('click',e=>{
    e.preventDefault();
    if(defaultLang==='fr') localStorage.setItem('lang','en');
    else localStorage.removeItem('lang');
    location.href='/resume';
  });
});
</script>
